<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms - Level 0</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: "Courier New", Courier, monospace; }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #d4b522; text-align: center; cursor: pointer; z-index: 10;
        }
        #instructions { font-size: 20px; line-height: 1.5; }
        .danger { color: #ff4444; font-weight: bold; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: rgba(255, 255, 255, 0.3); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 40px;">THE BACKROOMS</h1>
            <p>Click to enter.</p>
            <p><b>W, A, S, D</b> = Move | <b>Mouse</b> = Look Around | <b>ESC</b> = Pause</p>
            <p class="danger">If you hear something wandering nearby, it has definitely heard you.</p>
        </div>
    </div>
    
    <div id="crosshair"></div>

    <script>
        // --- 1. DETAILED PROCEDURAL TEXTURES ---
        
        // Detailed Yellow Wallpaper with Pattern & Grime
        function createWallpaperTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ccb043';
            ctx.fillRect(0, 0, 512, 512);

            ctx.strokeStyle = '#aa8f2c';
            ctx.lineWidth = 3;
            for (let y = 0; y < 512; y += 32) {
                for (let x = 0; x < 512; x += 32) {
                    ctx.beginPath();
                    ctx.moveTo(x, y + 16);
                    ctx.lineTo(x + 16, y);
                    ctx.lineTo(x + 32, y + 16);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x + 16, y + 16);
                    ctx.lineTo(x + 16, y + 32);
                    ctx.stroke();
                }
            }
            
            // Dirt & moisture staining
            for (let i = 0; i < 8000; i++) {
                ctx.fillStyle = `rgba(40, 30, 0, ${Math.random() * 0.08})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, Math.random() * 6, Math.random() * 6);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1.5, 1);
            return texture;
        }

        // Damp Dirty Carpet Texture
        function createCarpetTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#4a4425';
            ctx.fillRect(0, 0, 512, 512);

            // Carpet noise texture
            for (let i = 0; i < 25000; i++) {
                const val = Math.floor(Math.random() * 40);
                ctx.fillStyle = `rgb(${65 + val}, ${60 + val}, ${30 + val})`;
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }

            // Damp dark stains
            for (let i = 0; i < 30; i++) {
                const sx = Math.random() * 512, sy = Math.random() * 512, sr = 10 + Math.random() * 30;
                const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
                grad.addColorStop(0, 'rgba(15, 12, 5, 0.6)');
                grad.addColorStop(1, 'rgba(15, 12, 5, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(80, 80);
            return texture;
        }

        // Ceiling Tiles with Metal Grid Lines & Acoustic Pits
        function createCeilingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#cfceca';
            ctx.fillRect(0, 0, 512, 512);

            // Acoustic tile dots
            ctx.fillStyle = '#a8a7a2';
            for (let i = 0; i < 6000; i++) {
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }

            // Dark T-bar Grid Lines between tiles
            ctx.strokeStyle = '#2b2a27';
            ctx.lineWidth = 12;
            ctx.strokeRect(0, 0, 512, 512);

            // Inner metal border detail
            ctx.strokeStyle = '#6e6d68';
            ctx.lineWidth = 4;
            ctx.strokeRect(6, 6, 500, 500);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(60, 60);
            return texture;
        }

        // --- 2. SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x8a7724);
        scene.fog = new THREE.Fog(0x8a7724, 15, 150);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 1000);
        camera.position.y = 7.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
        scene.add(ambientLight);

        // --- 3. ENVIRONMENT BUILD ---
        const wallMat = new THREE.MeshLambertMaterial({ map: createWallpaperTexture() });
        const floorMat = new THREE.MeshLambertMaterial({ map: createCarpetTexture() });
        const ceilingMat = new THREE.MeshLambertMaterial({ map: createCeilingTexture() });

        const floorGeo = new THREE.PlaneGeometry(1000, 1000);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceilingHeight = 16;
        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = ceilingHeight;
        scene.add(ceiling);

        const objects = [];
        const lights = [];

        const wallGeo = new THREE.BoxGeometry(20, ceilingHeight, 2);
        const lightHousingGeo = new THREE.BoxGeometry(8, 0.6, 4);
        const lightTubeGeo = new THREE.BoxGeometry(7, 0.2, 3);
        const lightHousingMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
        const lightTubeMat = new THREE.MeshBasicMaterial({ color: 0xfffee0 });

        const occupiedGrid = new Set();

        // Wall Generation
        for (let x = -400; x <= 400; x += 30) {
            for (let z = -400; z <= 400; z += 30) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;

                if (Math.random() < 0.38) {
                    const wall = new THREE.Mesh(wallGeo, wallMat);
                    wall.position.set(x, ceilingHeight / 2, z);
                    if (Math.random() > 0.5) wall.rotation.y = Math.PI / 2;
                    scene.add(wall);
                    objects.push(wall);
                    occupiedGrid.add(`${x},${z}`);
                }
            }
        }

        // Ceiling Fluorescent Light Fixtures
        for (let x = -380; x <= 380; x += 40) {
            for (let z = -380; z <= 380; z += 40) {
                if (!occupiedGrid.has(`${x},${z}`)) {
                    const housing = new THREE.Mesh(lightHousingGeo, lightHousingMat);
                    housing.position.set(x, ceilingHeight - 0.3, z);
                    scene.add(housing);

                    const tube = new THREE.Mesh(lightTubeGeo, lightTubeMat);
                    tube.position.set(x, ceilingHeight - 0.5, z);
                    scene.add(tube);

                    const pLight = new THREE.PointLight(0xfffae0, 0.75, 40);
                    pLight.position.set(x, ceilingHeight - 2, z);
                    scene.add(pLight);
                    lights.push(pLight);
                }
            }
        }

        // --- 4. CONTROLS & COLLISION ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        instructions.addEventListener('click', () => controls.lock());
        controls.addEventListener('lock', () => blocker.style.display = 'none');
        controls.addEventListener('unlock', () => blocker.style.display = 'flex');
        scene.add(controls.getObject());

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();
        let headBobTimer = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 280.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 280.0 * delta;

                const playerPos = controls.getObject().position;
                const oldX = playerPos.x;
                const oldZ = playerPos.z;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Wall Collision Check
                const playerRadius = 2.5;
                for (let i = 0; i < objects.length; i++) {
                    const wallBox = new THREE.Box3().setFromObject(objects[i]);
                    const playerBox = new THREE.Box3(
                        new THREE.Vector3(playerPos.x - playerRadius, 0, playerPos.z - playerRadius),
                        new THREE.Vector3(playerPos.x + playerRadius, ceilingHeight, playerPos.z + playerRadius)
                    );

                    if (wallBox.intersectsBox(playerBox)) {
                        playerPos.x = oldX;
                        playerPos.z = oldZ;
                        break;
                    }
                }

                // Head Bobbing Effect while moving
                const isMoving = moveForward || moveBackward || moveLeft || moveRight;
                if (isMoving) {
                    headBobTimer += delta * 10;
                    camera.position.y = 7.5 + Math.sin(headBobTimer) * 0.15;
                } else {
                    camera.position.y = 7.5;
                }

                // Fluorescent Light Flickering
                if (Math.random() < 0.04 && lights.length > 0) {
                    const targetLight = lights[Math.floor(Math.random() * lights.length)];
                    targetLight.intensity = Math.random() < 0.4 ? 0.05 : 0.75;
                }

                prevTime = time;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
