<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPVP Arena - Multiplayer Floating Island Battle</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b1d3a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #050b14, #1b365d);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; z-index: 20; text-align: center;
        }
        h1 { font-size: 65px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 6px; color: #00ffcc; text-shadow: 0 4px 20px rgba(0,255,204,0.4); }
        p { color: #b0c4de; font-size: 19px; margin-bottom: 30px; }
        .btn {
            background: #ff0055; color: #fff; border: none; padding: 16px 45px;
            font-size: 19px; font-weight: bold; border-radius: 35px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 6px 20px rgba(255,0,85,0.5); text-transform: uppercase; margin: 10px;
        }
        .btn:hover { background: #ff3377; transform: scale(1.06); }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff; font-size: 18px;
            font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6); padding: 14px 22px; border-radius: 14px; border: 1px solid rgba(0,255,204,0.3);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background-color: rgba(0, 255, 204, 0.9); border: 2px solid #000; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>SkyPVP Arena</h1>
        <p>A fast-paced multiplayer floating island combat game! Collect magic orbs, upgrade your sword, and battle friends.</p>
        <div>
            <button class="btn" id="startBtn">Singleplayer Practice</button>
            <button class="btn" id="hostOnlineBtn" style="background:#00bcd4;">Host Arena Match</button>
            <button class="btn" id="joinOnlineBtn" style="background:#e91e63;">Join Match Code</button>
        </div>
        <div id="roomInfo" style="margin-top: 18px; font-size: 17px; color: #00ffcc;"></div>
    </div>

    <div id="hud">
        Health: <span id="healthDisplay" style="color:#ff0055;">100 / 100</span><br>
        Score / Kills: <span id="scoreDisplay" style="color:#00ffcc;">0</span><br>
        <span style="font-size:13px; color:#aaa;">WASD to Move | Space to Jump | Click to Attack / Shoot Energy Orb</span>
    </div>

    <div id="crosshair"></div>

    <script>
        // --- MULTIPLAYER SETUP ---
        let peer, conn;
        let isHost = false;
        let myId = '';
        let isOnline = false;
        let remotePlayer;
        let remotePlayerHealth = 100;

        const menu = document.getElementById('menu');
        const roomInfo = document.getElementById('roomInfo');

        document.getElementById('startBtn').addEventListener('click', () => {
            menu.style.display = 'none';
            controls.lock();
        });

        document.getElementById('hostOnlineBtn').addEventListener('click', () => {
            isOnline = true;
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = true;
                roomInfo.innerHTML = `Arena Code: <b>${id}</b><br>Share with your friend! Waiting...`;
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                menu.style.display = 'none';
                controls.lock();
            });
        });

        document.getElementById('joinOnlineBtn').addEventListener('click', () => {
            isOnline = true;
            const friendId = prompt("Enter Arena Match Code:");
            if (!friendId) return;
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = false;
                conn = peer.connect(friendId);
                setupConnection();
                menu.style.display = 'none';
                controls.lock();
            });
        });

        function setupConnection() {
            conn.on('open', () => { roomInfo.innerHTML = "Connected to Arena match!"; });
            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    if (remotePlayer) {
                        remotePlayer.visible = true;
                        remotePlayer.position.set(data.x, data.y, data.z);
                        remotePlayer.rotation.y = data.ry;
                    }
                } else if (data.type === 'attack') {
                    // Trigger visual slash or hit effect from opponent
                    spawnEnergyOrb(data.x, data.y, data.z, data.dx, data.dy, data.dz, false);
                } else if (data.type === 'damage') {
                    playerHealth = Math.max(0, playerHealth - data.amount);
                    document.getElementById('healthDisplay').innerText = `${playerHealth} / 100`;
                    if (playerHealth <= 0) {
                        alert("You were defeated! Respawning...");
                        playerHealth = 100;
                        camera.position.set(0, 15, 0);
                    }
                }
            });
        }

        // --- 3D ARENA SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1d3a);
        scene.fog = new THREE.FogExp2(0x0b1d3a, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 1000);
        camera.position.set(0, 15, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
        sunLight.position.set(30, 80, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- FLOATING ISLANDS MAP ---
        const islandsGroup = new THREE.Group();
        scene.add(islandsGroup);

        const islandData = [
            { x: 0, y: 0, z: 0, size: 40 },
            { x: 60, y: 5, z: -60, size: 25 },
            { x: -60, y: 8, z: -60, size: 25 },
            { x: 60, y: 5, z: 60, size: 25 },
            { x: -60, y: 8, z: 60, size: 25 },
            { x: 0, y: 15, z: -110, size: 30 } // Boss Island
        ];

        const solidObjects = [];

        islandData.forEach(data => {
            // Island Base (Rock)
            const rockGeo = new THREE.ConeGeometry(data.size, data.size * 0.8, 7);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a4b65, roughness: 0.9 });
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set(data.x, data.y - (data.size * 0.4), data.z);
            rock.rotation.x = Math.PI;
            islandsGroup.add(rock);

            // Island Top (Grass/Stone)
            const topGeo = new THREE.CylinderGeometry(data.size, data.size * 0.9, 3, 16);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x1b4332, roughness: 0.6 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.set(data.x, data.y, data.z);
            islandsGroup.add(top);
            solidObjects.push(top);

            // Add floating crystals or pillars for atmosphere
            const pillarGeo = new THREE.BoxGeometry(3, 12, 3);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.5 });
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            pillar.position.set(data.x + (data.size * 0.4), data.y + 6, data.z + (data.size * 0.4));
            islandsGroup.add(pillar);
        });

        // --- PLAYER CHARACTER & OPPONENT MODELS ---
        function createPlayerModel(isRemote) {
            const group = new THREE.Group();
            const armorMat = new THREE.MeshStandardMaterial({ color: isRemote ? 0xff0055 : 0x00ffcc, roughness: 0.3 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.6), armorMat);
            torso.position.y = 2.5;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), darkMat);
            head.position.y = 3.8;
            group.add(head);

            // Glowing visor
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.2), armorMat);
            visor.position.set(0, 3.8, -0.45);
            group.add(visor);

            // Weapon (Energy Sword in hand)
            const swordBlade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 0.2), armorMat);
            swordBlade.position.set(0.9, 2.2, -0.5);
            group.add(swordBlade);

            return group;
        }

        const localPlayer = createPlayerModel(false);
        scene.add(localPlayer);

        remotePlayer = createPlayerModel(true);
        remotePlayer.visible = false;
        scene.add(remotePlayer);

        // --- ENERGY PROJECTILES SYSTEM ---
        const activeProjectiles = [];

        function spawnEnergyOrb(x, y, z, dx, dy, dz, sendNetwork) {
            const orbGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const orbMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.0 });
            const orb = new THREE.Mesh(orbGeo, orbMat);
            orb.position.set(x, y, z);
            scene.add(orb);

            activeProjectiles.push({
                mesh: orb,
                dir: new THREE.Vector3(dx, dy, dz).normalize(),
                speed: 45,
                life: 3.0
            });

            if (sendNetwork && isOnline && conn && conn.open) {
                conn.send({ type: 'attack', x: x, y: y, z: z, dx: dx, dy: dy, dz: dz });
            }
        }

        let playerHealth = 100;
        let playerScore = 0;

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(2));
            spawnEnergyOrb(spawnPos.x, spawnPos.y, spawnPos.z, dir.x, dir.y, dir.z, true);
        });

        // --- CONTROLS & MOVEMENT ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyV') {
                if (controls.isLocked) controls.unlock();
                else controls.lock();
                return;
            }
            if (!controls.isLocked) return;
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) { velocity.y += 14; canJump = false; }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // --- GAME LOOP ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += velocity.y * delta;

                // Simple Island collision check
                let onIsland = false;
                islandData.forEach(data => {
                    const distXZ = Math.hypot(camera.position.x - data.x, camera.position.z - data.z);
                    const surfaceY = data.y + 2.5;
                    if (distXZ < data.size && camera.position.y >= surfaceY && camera.position.y <= surfaceY + 4 && velocity.y <= 0) {
                        camera.position.y = surfaceY;
                        velocity.y = 0;
                        canJump = true;
                        onIsland = true;
                    }
                });

                // Fall into abyss condition
                if (camera.position.y < -40) {
                    playerHealth = Math.max(0, playerHealth - 25);
                    document.getElementById('healthDisplay').innerText = `${playerHealth} / 100`;
                    camera.position.set(0, 15, 0);
                    velocity.y = 0;
                }

                // Update Projectiles
                for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                    const p = activeProjectiles[i];
                    p.mesh.position.addScaledVector(p.dir, p.speed * delta);
                    p.life -= delta;

                    // Check hit with remote player
                    if (remotePlayer.visible && p.mesh.position.distanceTo(remotePlayer.position) < 3.0) {
                        playerScore += 10;
                        document.getElementById('scoreDisplay').innerText = playerScore;
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                        if (isOnline && conn && conn.open) {
                            conn.send({ type: 'damage', amount: 25 });
                        }
                        continue;
                    }

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                    }
                }

                const camPos = camera.position;
                localPlayer.position.set(camPos.x, camPos.y - 3.5, camPos.z);
                localPlayer.rotation.y = controls.getObject().rotation.y;

                if (isOnline && conn && conn.open) {
                    conn.send({
                        type: 'pos',
                        x: camPos.x,
                        y: camPos.y,
                        z: camPos.z,
                        ry: controls.getObject().rotation.y
                    });
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
