<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Velocity - Singleplayer, AI Opponents & Online Multiplayer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #03030c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #090314, #1a0b36, #05020c);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; z-index: 10; text-align: center;
        }
        h1 { font-size: 55px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 6px; color: #00f0ff; text-shadow: 0 0 25px rgba(0,240,255,0.6); }
        p { color: #a19fc8; font-size: 18px; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .btn {
            background: linear-gradient(45deg, #00f0ff, #7000ff); color: #fff; border: none; padding: 15px 40px;
            font-size: 17px; font-weight: bold; border-radius: 30px; cursor: pointer;
            transition: 0.3s; box-shadow: 0 0 20px rgba(0,240,255,0.4); text-transform: uppercase; letter-spacing: 2px; width: 280px;
        }
        .btn:hover { box-shadow: 0 0 30px #00f0ff, 0 0 50px #7000ff; transform: scale(1.04); }
        #hud {
            position: absolute; top: 25px; left: 25px; color: #fff; font-size: 22px;
            font-weight: bold; pointer-events: none; z-index: 5; text-shadow: 0 0 8px rgba(0,240,255,0.8);
            background: rgba(10, 5, 25, 0.6); padding: 12px 25px; border-radius: 12px; border: 1px solid rgba(0,240,255,0.3);
        }
        #controls-hint {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.6); font-size: 15px; pointer-events: none; z-index: 5; text-align: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>Neon Velocity</h1>
        <p>Futuristic Hovercraft Racing Circuit</p>
        <div class="btn-group">
            <button class="btn" id="aiBtn">Race vs Smart AI</button>
            <button class="btn" id="hostBtn" style="background: linear-gradient(45deg, #00ff7f, #00f0ff);">Host Online Room</button>
            <button class="btn" id="joinBtn" style="background: linear-gradient(45deg, #ff007f, #ffaa00);">Join Friend Code</button>
        </div>
        <div id="roomInfo" style="margin-top: 20px; font-size: 16px; color: #00f0ff; max-width: 500px; line-height: 1.5;"></div>
    </div>

    <div id="hud">Speed: <span id="speedVal">0</span> KM/H</div>
    <div id="controls-hint"><b>W, A, S, D</b> = Steer & Drive Hovercraft | <b>Mouse</b> = Look Around | <b>ESC</b> = Pause</div>

    <script>
        // --- GAME MODES & MULTIPLAYER STATE ---
        let gameMode = ''; // 'ai' or 'online'
        let peer, conn;
        let isHost = false;
        let myId = '';
        let remoteHovercraft;
        let aiHovercraft;
        let aiZ = 20;
        let aiSpeed = 75;

        const menu = document.getElementById('menu');
        const roomInfo = document.getElementById('roomInfo');
        const speedVal = document.getElementById('speedVal');

        document.getElementById('aiBtn').addEventListener('click', () => {
            gameMode = 'ai';
            menu.style.display = 'none';
            controls.lock();
            aiHovercraft.visible = true;
        });

        document.getElementById('hostBtn').addEventListener('click', () => {
            gameMode = 'online';
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = true;
                roomInfo.innerHTML = `Room Code: <b style="color:#fff;font-size:20px;">${id}</b><br>Share this code with your friend! Waiting...`;
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                startOnlineGame();
            });
        });

        document.getElementById('joinBtn').addEventListener('click', () => {
            gameMode = 'online';
            const friendId = prompt("Enter your friend's Room Code:");
            if (!friendId) return;
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = false;
                conn = peer.connect(friendId);
                setupConnection();
                startOnlineGame();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                roomInfo.innerHTML = "Connected! Launching race...";
                setTimeout(() => {
                    menu.style.display = 'none';
                    controls.lock();
                    remoteHovercraft.visible = true;
                }, 1000);
            });
            conn.on('data', (data) => {
                if (data.type === 'pos' && remoteHovercraft) {
                    remoteHovercraft.position.set(data.x, data.y, data.z);
                    remoteHovercraft.rotation.y = data.ry;
                }
            });
        }

        function startOnlineGame() {
            setTimeout(() => {
                if (menu.style.display !== 'none') {
                    menu.style.display = 'none';
                    controls.lock();
                    remoteHovercraft.visible = true;
                }
            }, 1500);
        }

        // --- 3D GRAPHICS & SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040412);
        scene.fog = new THREE.FogExp2(0x040412, 0.012);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 1000);
        camera.position.set(0, 6, -12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00f0ff, 1.2);
        dirLight.position.set(50, 80, 50);
        scene.add(dirLight);

        // --- TRACK & ENVIRONMENT ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        const floorMat = new THREE.MeshStandardMaterial({ color: 0x0c0b1c, roughness: 0.3, metalness: 0.8 });
        const trackRoad = new THREE.Mesh(new THREE.PlaneGeometry(60, 1500), floorMat);
        trackRoad.rotation.x = -Math.PI / 2;
        trackRoad.position.set(0, 0, 700);
        trackGroup.add(trackRoad);

        const barrierMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
        const archMat = new THREE.MeshBasicMaterial({ color: 0xff007f });

        for (let z = 0; z < 1400; z += 50) {
            const leftBar = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 45), barrierMat);
            leftBar.position.set(-31, 2, z);
            trackGroup.add(leftBar);

            const rightBar = new THREE.Mesh(new THREE.BoxGeometry(2, 4, 45), barrierMat);
            rightBar.position.set(31, 2, z);
            trackGroup.add(rightBar);

            const archTop = new THREE.Mesh(new THREE.BoxGeometry(64, 1.5, 3), archMat);
            archTop.position.set(0, 18, z);
            trackGroup.add(archTop);
        }

        // --- PLAYER HOVERCRAFT ---
        const playerHovercraft = new THREE.Group();
        const hullMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, metalness: 0.9, roughness: 0.2 });
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0xff007f, emissive: 0xff007f, emissiveIntensity: 0.5 });

        const hull = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 7), hullMat);
        hull.position.y = 1.5;
        playerHovercraft.add(hull);

        const cockpit = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 3), cockpitMat);
        cockpit.position.set(0, 2, 0.5);
        playerHovercraft.add(cockpit);
        scene.add(playerHovercraft);

        // --- REMOTE FRIEND HOVERCRAFT ---
        remoteHovercraft = new THREE.Group();
        const rHull = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 7), new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.9 }));
        rHull.position.y = 1.5;
        remoteHovercraft.add(rHull);
        remoteHovercraft.visible = false;
        scene.add(remoteHovercraft);

        // --- SMART AI OPPONENT HOVERCRAFT ---
        aiHovercraft = new THREE.Group();
        const aiHull = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 7), new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.9 }));
        aiHull.position.y = 1.5;
        aiHovercraft.add(aiHull);
        aiHovercraft.visible = false;
        scene.add(aiHovercraft);
        aiHovercraft.position.set(8, 0, 30);

        // --- CONTROLS & PHYSICS ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let speed = 0;
        let maxSpeed = 130.0;
        let acceleration = 55.0;
        let steering = 0;
        let hovercraftAngle = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // --- GAME LOOP ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (controls.isLocked) {
                // Physics
                if (moveForward) speed += acceleration * delta;
                else if (moveBackward) speed -= acceleration * 1.5 * delta;
                else speed -= speed * 2.0 * delta;

                speed = Math.max(-30, Math.min(speed, maxSpeed));
                speedVal.innerText = Math.round(Math.abs(speed));

                if (moveLeft) hovercraftAngle += 1.5 * delta;
                if (moveRight) hovercraftAngle -= 1.5 * delta;

                playerHovercraft.position.x += Math.sin(hovercraftAngle) * speed * delta;
                playerHovercraft.position.z += Math.cos(hovercraftAngle) * speed * delta;
                playerHovercraft.rotation.y = hovercraftAngle;
                playerHovercraft.position.x = Math.max(-28, Math.min(28, playerHovercraft.position.x));

                // Camera follow
                const camDistX = playerHovercraft.position.x - Math.sin(hovercraftAngle) * 12;
                const camDistZ = playerHovercraft.position.z - Math.cos(hovercraftAngle) * 12;
                camera.position.x += (camDistX - camera.position.x) * 0.1;
                camera.position.z += (camDistZ - camera.position.z) * 0.1;
                camera.position.y = playerHovercraft.position.y + 5;
                camera.lookAt(playerHovercraft.position.x, playerHovercraft.position.y + 2, playerHovercraft.position.z + 10);

                // Smart AI Opponent Logic
                if (gameMode === 'ai') {
                    aiZ += aiSpeed * delta;
                    // AI weaves slightly across track and matches competitive speed
                    const aiX = Math.sin(aiZ * 0.01) * 15;
                    aiHovercraft.position.set(aiX, 0, aiZ);
                    aiHovercraft.rotation.y = Math.cos(aiZ * 0.01) * 0.2;

                    // Loop AI track course infinitely
                    if (aiZ > 1300) aiZ = 0;
                }

                // Online Multiplayer sync
                if (gameMode === 'online' && conn && conn.open) {
                    conn.send({
                        type: 'pos',
                        x: playerHovercraft.position.x,
                        y: playerHovercraft.position.y,
                        z: playerHovercraft.position.z,
                        ry: hovercraftAngle
                    });
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
