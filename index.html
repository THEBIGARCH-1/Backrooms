<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPVP Arena - Character Select, First-Person Weapons & Jetpack Flames</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0b1d3a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #menu {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(135deg, #050b14, #1b365d);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; z-index: 20; text-align: center;
        }
        h1 { font-size: 65px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 6px; color: #00ffcc; text-shadow: 0 4px 20px rgba(0,255,204,0.4); }
        p { color: #b0c4de; font-size: 19px; margin-bottom: 25px; }
        .char-select { display: flex; gap: 20px; margin-bottom: 30px; }
        .char-card {
            background: rgba(255,255,255,0.05); border: 3px solid rgba(0,255,204,0.3); padding: 18px 28px;
            border-radius: 16px; cursor: pointer; transition: 0.2s; font-weight: bold; font-size: 18px; color: #fff;
        }
        .char-card.selected { border-color: #ff0055; background: rgba(255,0,85,0.15); box-shadow: 0 0 20px rgba(255,0,85,0.4); }
        .btn {
            background: #ff0055; color: #fff; border: none; padding: 16px 45px;
            font-size: 19px; font-weight: bold; border-radius: 35px; cursor: pointer;
            transition: 0.2s; box-shadow: 0 6px 20px rgba(255,0,85,0.5); text-transform: uppercase; margin: 10px;
        }
        .btn:hover { background: #ff3377; transform: scale(1.06); }
        #hud {
            position: absolute; top: 20px; left: 20px; color: #fff; font-size: 18px;
            font-weight: bold; pointer-events: none; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.6); padding: 14px 22px; border-radius: 14px; border: 1px solid rgba(0,255,204,0.3);
        }
        #loadout-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 12px; background: rgba(0,0,0,0.75); padding: 12px 24px;
            border-radius: 18px; z-index: 10; backdrop-filter: blur(6px); color: #fff; font-size: 15px; font-weight: bold;
        }
        .slot {
            background: #222; border: 2px solid #00ffcc; padding: 10px 18px; border-radius: 10px; text-align: center;
            box-shadow: 0 4px 10px rgba(0,255,204,0.2);
        }
        .slot.active { background: #00ffcc; color: #000; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background-color: rgba(0, 255, 204, 0.9); border: 2px solid #000; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>SkyPVP Arena</h1>
        <p>Choose your character, grab your weapon, and enter the battle!</p>
        <div class="char-select">
            <div class="char-card selected" id="selectAstronaut" onclick="selectCharacter('astronaut')">🧑‍🚀 Astronaut</div>
            <div class="char-card" id="selectAlien" onclick="selectCharacter('alien')">👽 Alien</div>
        </div>
        <div>
            <button class="btn" id="startBtn">Singleplayer Practice</button>
            <button class="btn" id="hostOnlineBtn" style="background:#00bcd4;">Host Arena Match</button>
            <button class="btn" id="joinOnlineBtn" style="background:#e91e63;">Join Match Code</button>
        </div>
        <div id="roomInfo" style="margin-top: 18px; font-size: 17px; color: #00ffcc;"></div>
    </div>

    <div id="hud">
        Health: <span id="healthDisplay" style="color:#ff0055;">100 / 100</span><br>
        Score / Kills: <span id="scoreDisplay" style="color:#00ffcc;">0</span><br>
        <span style="font-size:13px; color:#aaa;">WASD: Move | E: Sword | Q: Cannon | Shift: Jetpack Fly & Flames | Click: Attack</span>
    </div>

    <div id="loadout-bar">
        <div class="slot active" id="slot1">[E] Energy Sword</div>
        <div class="slot" id="slot2">[Q] Hand Cannon</div>
        <div class="slot" id="slot3">[Shift] Jetpack Flight</div>
    </div>

    <div id="crosshair"></div>

    <script>
        // --- CHARACTER CONFIG ---
        let chosenCharacter = 'astronaut';

        function selectCharacter(type) {
            chosenCharacter = type;
            document.getElementById('selectAstronaut').classList.toggle('selected', type === 'astronaut');
            document.getElementById('selectAlien').classList.toggle('selected', type === 'alien');
        }

        // --- MULTIPLAYER SETUP ---
        let peer, conn;
        let isHost = false;
        let myId = '';
        let isOnline = false;
        let remotePlayer;

        const menu = document.getElementById('menu');
        const roomInfo = document.getElementById('roomInfo');

        document.getElementById('startBtn').addEventListener('click', () => {
            menu.style.display = 'none';
            initPlayerModel(chosenCharacter);
            controls.lock();
        });

        document.getElementById('hostOnlineBtn').addEventListener('click', () => {
            isOnline = true;
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = true;
                roomInfo.innerHTML = `Arena Code: <b>${id}</b><br>Share with your friend! Waiting...`;
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                menu.style.display = 'none';
                initPlayerModel(chosenCharacter);
                controls.lock();
            });
        });

        document.getElementById('joinOnlineBtn').addEventListener('click', () => {
            isOnline = true;
            const friendId = prompt("Enter Arena Match Code:");
            if (!friendId) return;
            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                isHost = false;
                conn = peer.connect(friendId);
                setupConnection();
                menu.style.display = 'none';
                initPlayerModel(chosenCharacter);
                controls.lock();
            });
        });

        function setupConnection() {
            conn.on('open', () => { roomInfo.innerHTML = "Connected to Arena match!"; });
            conn.on('data', (data) => {
                if (data.type === 'pos') {
                    if (remotePlayer) {
                        remotePlayer.visible = true;
                        remotePlayer.position.set(data.x, data.y, data.z);
                        remotePlayer.rotation.y = data.ry;
                        // Handle remote player jetpack flame visibility
                        if (remotePlayer.userData.flames) {
                            remotePlayer.userData.flames.visible = data.isFlying;
                        }
                    }
                } else if (data.type === 'attack') {
                    spawnProjectile(data.x, data.y, data.z, data.dx, data.dy, data.dz, data.isCannon, false);
                } else if (data.type === 'damage') {
                    playerHealth = Math.max(0, playerHealth - data.amount);
                    document.getElementById('healthDisplay').innerText = `${playerHealth} / 100`;
                    if (playerHealth <= 0) {
                        alert("You were defeated! Respawning at Center Island...");
                        playerHealth = 100;
                        camera.position.set(0, 15, 0);
                    }
                } else if (data.type === 'initChar') {
                    createRemotePlayerModel(data.charType);
                }
            });
        }

        // --- 3D SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1d3a);
        scene.fog = new THREE.FogExp2(0x0b1d3a, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.5, 1000);
        camera.position.set(0, 15, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(40, 90, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // --- REALISTIC ISLANDS & BRIDGES (NO WEIRD PILLARS) ---
        const solidObjects = [];
        const islandData = [
            { x: 0, y: 10, z: 0, size: 35 },
            { x: 70, y: 10, z: 0, size: 25 },
            { x: -70, y: 10, z: 0, size: 25 },
            { x: 0, y: 10, z: 70, size: 25 },
            { x: 0, y: 10, z: -70, size: 25 }
        ];

        islandData.forEach(data => {
            // Rugged stone base
            const rockGeo = new THREE.ConeGeometry(data.size, data.size * 0.8, 8);
            const rockMat = new THREE.MeshStandardMaterial({ color: 0x4a5568, roughness: 0.9, flatShading: true });
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.position.set(data.x, data.y - (data.size * 0.4), data.z);
            rock.rotation.x = Math.PI;
            scene.add(rock);

            // Detailed textured top surface (Mossy Grass Layer)
            const topGeo = new THREE.CylinderGeometry(data.size, data.size * 0.95, 3, 24);
            const topMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.7 });
            const top = new THREE.Mesh(topGeo, topMat);
            top.position.set(data.x, data.y, data.z);
            scene.add(top);
            solidObjects.push({ x: data.x, z: data.z, radius: data.size, y: data.y });
        });

        // Connecting Bridges
        const bridgeData = [
            { startX: 0, startZ: 0, endX: 70, endZ: 0 },
            { startX: 0, startZ: 0, endX: -70, endZ: 0 },
            { startX: 0, startZ: 0, endX: 0, endZ: 70 },
            { startX: 0, startZ: 0, endX: 0, endZ: -70 }
        ];

        const bridgeColliders = [];
        bridgeData.forEach(b => {
            const length = Math.hypot(b.endX - b.startX, b.endZ - b.startZ);
            const bridgeGeo = new THREE.BoxGeometry(6, 1, length);
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x555b6e, roughness: 0.6 });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            
            const centerX = (b.startX + b.endX) / 2;
            const centerZ = (b.startZ + b.endZ) / 2;
            bridge.position.set(centerX, 10, centerZ);

            if (b.startX !== b.endX) bridge.rotation.y = Math.PI / 2;
            scene.add(bridge);
            bridgeColliders.push({ x1: Math.min(b.startX, b.endX) - 4, x2: Math.max(b.startX, b.endX) + 4, z1: Math.min(b.startZ, b.endZ) - 4, z2: Math.max(b.startZ, b.endZ) + 4, y: 10 });
        });

        // --- FIRST-PERSON WEAPON MODEL ATTACHED TO CAMERA ---
        const weaponGroup = new THREE.Group();
        camera.add(weaponGroup);
        scene.add(camera);

        let swordMesh, cannonMesh;

        function buildFirstPersonWeapons() {
            // Energy Sword Viewmodel
            swordMesh = new THREE.Group();
            const hilt = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0x333333 }));
            hilt.rotation.x = Math.PI / 2;
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 0.04), new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 }));
            blade.position.set(0, 0.7, 0);
            swordMesh.add(hilt);
            swordMesh.add(blade);
            swordMesh.position.set(0.4, -0.3, -0.6);
            weaponGroup.add(swordMesh);

            // Hand Cannon Viewmodel
            cannonMesh = new THREE.Group();
            const cannonBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 1.0, 16), new THREE.MeshStandardMaterial({ color: 0xff5500, metalness: 0.8 }));
            cannonBarrel.rotation.x = Math.PI / 2;
            cannonMesh.add(cannonBarrel);
            cannonMesh.position.set(0.4, -0.35, -0.7);
            cannonMesh.visible = false;
            weaponGroup.add(cannonMesh);
        }
        buildFirstPersonWeapons();

        // --- CHARACTER MODELS & JETPACK FLAMES ---
        let localPlayerModel;
        let localFlames;
        let currentSlot = 1; // 1: Sword (E), 2: Cannon (Q), 3: Jetpack (Shift)

        function createCharacterGeometry(type) {
            const group = new THREE.Group();
            if (type === 'astronaut') {
                const suitMat = new THREE.MeshStandardMaterial({ color: 0xf8f9fa, roughness: 0.4 });
                const visorMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, metalness: 0.9, roughness: 0.1 });
                
                const body = new THREE.Mesh(new THREE.SphereGeometry(1.0, 16, 16), suitMat);
                body.position.y = 2.2;
                group.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), suitMat);
                head.position.y = 3.6;
                group.add(head);

                const visor = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), visorMat);
                visor.position.set(0, 3.6, -0.3);
                group.add(visor);
            } else {
                // Alien Character
                const alienMat = new THREE.MeshStandardMaterial({ color: 0x38b000, roughness: 0.3 });
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });

                const body = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 16), alienMat);
                body.position.y = 2.0;
                group.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), alienMat);
                head.scale.set(1.2, 1.0, 1.2);
                head.position.y = 3.5;
                group.add(head);

                const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), eyeMat);
                eyeL.position.set(-0.35, 3.6, -0.6);
                group.add(eyeL);

                const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), eyeMat);
                eyeR.position.set(0.35, 3.6, -0.6);
                group.add(eyeR);
            }

            // Jetpack Tank
            const jetpackMat = new THREE.MeshStandardMaterial({ color: 0x212529 });
            const jetpack = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.5), jetpackMat);
            jetpack.position.set(0, 2.4, 0.5);
            group.add(jetpack);

            // Jetpack Flames (Dynamic Particle/Cone)
            const flameMat = new THREE.MeshStandardMaterial({ color: 0xff5400, emissive: 0xff5400, emissiveIntensity: 1.5, transparent: true, opacity: 0.8 });
            const flames = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.5, 8), flameMat);
            flames.rotation.x = Math.PI;
            flames.position.set(0, 1.3, 0.6);
            flames.visible = false;
            group.add(flames);
            group.userData = { flames: flames };

            return group;
        }

        function initPlayerModel(type) {
            localPlayerModel = createCharacterGeometry(type);
            scene.add(localPlayerModel);

            if (isOnline && conn && conn.open) {
                conn.send({ type: 'initChar', charType: type });
            }
        }

        function createRemotePlayerModel(type) {
            remotePlayer = createCharacterGeometry(type);
            remotePlayer.visible = false;
            scene.add(remotePlayer);
        }

        // --- PROJECTILES SYSTEM ---
        const activeProjectiles = [];

        function spawnProjectile(x, y, z, dx, dy, dz, isCannon, sendNetwork) {
            const geo = isCannon ? new THREE.SphereGeometry(0.8, 16, 16) : new THREE.BoxGeometry(0.3, 0.3, 2.0);
            const mat = new THREE.MeshStandardMaterial({ color: isCannon ? 0xff5500 : 0x00ffcc, emissive: isCannon ? 0xff3300 : 0x00ffcc, emissiveIntensity: 1.0 });
            const proj = new THREE.Mesh(geo, mat);
            proj.position.set(x, y, z);
            scene.add(proj);

            activeProjectiles.push({
                mesh: proj,
                dir: new THREE.Vector3(dx, dy, dz).normalize(),
                speed: isCannon ? 35 : 55,
                damage: isCannon ? 40 : 20,
                life: 3.0
            });

            if (sendNetwork && isOnline && conn && conn.open) {
                conn.send({ type: 'attack', x: x, y: y, z: z, dx: dx, dy: dy, dz: dz, isCannon: isCannon });
            }
        }

        let playerHealth = 100;
        let playerScore = 0;

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const spawnPos = camera.position.clone().add(dir.clone().multiplyScalar(2));

            if (currentSlot === 1) {
                spawnProjectile(spawnPos.x, spawnPos.y, spawnPos.z, dir.x, dir.y, dir.z, false, true);
            } else if (currentSlot === 2) {
                spawnProjectile(spawnPos.x, spawnPos.y, spawnPos.z, dir.x, dir.y, dir.z, true, true);
            }
        });

        // --- CONTROLS & JETPACK PHYSICS ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isJetpacking = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyV') {
                if (controls.isLocked) controls.unlock();
                else controls.lock();
                return;
            }

            if (e.code === 'KeyE') { currentSlot = 1; updateLoadoutUI(); }
            if (e.code === 'KeyQ') { currentSlot = 2; updateLoadoutUI(); }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') { currentSlot = 3; updateLoadoutUI(); isJetpacking = true; }

            if (!controls.isLocked) return;
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;
            
            if (e.code === 'Space' && canJump) {
                velocity.y += 12;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                isJetpacking = false;
            }
        });

        function updateLoadoutUI() {
            document.querySelectorAll('.slot').forEach((el, idx) => {
                if (idx + 1 === currentSlot) el.classList.add('active');
                else el.classList.remove('active');
            });
            if (swordMesh) swordMesh.visible = (currentSlot === 1);
            if (cannonMesh) cannonMesh.visible = (currentSlot === 2);
        }

        // --- GAME LOOP ---
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (controls.isLocked) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                if (isJetpacking && currentSlot === 3) {
                    velocity.y += 30.0 * delta;
                    velocity.y = Math.min(velocity.y, 14);
                    if (localPlayerModel && localPlayerModel.userData.flames) {
                        localPlayerModel.userData.flames.visible = true;
                        // Flicker animation effect for jetpack flames
                        localPlayerModel.userData.flames.scale.set(1 + Math.random() * 0.3, 1 + Math.random() * 0.4, 1 + Math.random() * 0.3);
                    }
                } else {
                    velocity.y -= 30.0 * delta;
                    if (localPlayerModel && localPlayerModel.userData.flames) {
                        localPlayerModel.userData.flames.visible = false;
                    }
                }

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                camera.position.y += velocity.y * delta;

                let grounded = false;
                const playerFootY = camera.position.y - 3.5;

                solidObjects.forEach(island => {
                    const distXZ = Math.hypot(camera.position.x - island.x, camera.position.z - island.z);
                    const surfaceTopY = island.y + 1.5;
                    const surfaceBottomY = island.y - 1.5;

                    if (distXZ < island.radius && playerFootY <= surfaceTopY && playerFootY >= surfaceBottomY && velocity.y <= 0) {
                        camera.position.y = surfaceTopY + 3.5;
                        velocity.y = 0;
                        canJump = true;
                        grounded = true;
                    }
                });

                bridgeColliders.forEach(b => {
                    if (camera.position.x >= b.x1 && camera.position.x <= b.x2 && camera.position.z >= b.z1 && camera.position.z <= b.z2) {
                        const surfaceTopY = b.y + 0.5;
                        if (playerFootY <= surfaceTopY + 1 && playerFootY >= surfaceTopY - 2 && velocity.y <= 0) {
                            camera.position.y = surfaceTopY + 3.5;
                            velocity.y = 0;
                            canJump = true;
                            grounded = true;
                        }
                    }
                });

                if (!grounded && velocity.y < 0 && !isJetpacking) {
                    canJump = false;
                }

                if (camera.position.y < -50) {
                    playerHealth = Math.max(0, playerHealth - 25);
                    document.getElementById('healthDisplay').innerText = `${playerHealth} / 100`;
                    camera.position.set(0, 20, 0);
                    velocity.y = 0;
                }

                for (let i = activeProjectiles.length - 1; i >= 0; i--) {
                    const p = activeProjectiles[i];
                    p.mesh.position.addScaledVector(p.dir, p.speed * delta);
                    p.life -= delta;

                    if (remotePlayer && remotePlayer.visible && p.mesh.position.distanceTo(remotePlayer.position) < 3.0) {
                        playerScore += 10;
                        document.getElementById('scoreDisplay').innerText = playerScore;
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                        if (isOnline && conn && conn.open) {
                            conn.send({ type: 'damage', amount: p.damage });
                        }
                        continue;
                    }

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                    }
                }

                const camPos = camera.position;
                if (localPlayerModel) {
                    localPlayerModel.position.set(camPos.x, camPos.y - 3.5, camPos.z);
                    localPlayerModel.rotation.y = controls.getObject().rotation.y;
                }

                if (isOnline && conn && conn.open) {
                    conn.send({
                        type: 'pos',
                        x: camPos.x,
                        y: camPos.y,
                        z: camPos.z,
                        ry: controls.getObject().rotation.y,
                        isFlying: isJetpacking
                    });
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
