<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Backrooms - 3D Level 0</title>
    <style>
        /* Make the game take up the whole screen */
        body { margin: 0; overflow: hidden; background-color: #000; font-family: "Courier New", Courier, monospace; }
        
        /* The start screen overlay */
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #d4b522; text-align: center; cursor: pointer; z-index: 10;
        }
        #instructions { font-size: 20px; line-height: 1.5; }
        .danger { color: #ff4444; font-weight: bold; }
        
        /* Simple crosshair in the center of the screen */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <h1 style="font-size: 40px;">THE BACKROOMS</h1>
            <p>Click anywhere to enter.</p>
            <p><b>W, A, S, D</b> = Move<br><b>Mouse</b> = Look Around<br><b>ESC</b> = Pause</p>
            <p class="danger">Don't lose your way.</p>
        </div>
    </div>
    
    <div id="crosshair"></div>

    <script>
        // --- 1. SETUP SCENE, CAMERA, AND RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9a8511); // Sickly mustard yellow
        scene.fog = new THREE.Fog(0x9a8511, 0, 80);   // Heavy fog to limit visibility

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.y = 10; // Eye level

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); // Base light
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xfffae6, 0.4); // Artificial fluorescent feel
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- 3. BUILD THE ENVIRONMENT (Floor, Ceiling, Walls) ---
        const textureLoader = new THREE.TextureLoader();
        
        // Materials (Using solid colors for maximum retro/uncanny vibe without needing image files)
        const floorMat = new THREE.MeshLambertMaterial({ color: 0x5a5022 }); 
        const ceilingMat = new THREE.MeshLambertMaterial({ color: 0xd4d4cc });
        const wallMat = new THREE.MeshLambertMaterial({ color: 0xbdab40 }); // Yellow wallpaper color

        // Floor
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Ceiling
        const ceiling = new THREE.Mesh(floorGeo, ceilingMat);
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.y = 20;
        scene.add(ceiling);

        // Generate Random Staggered Walls
        const wallGeo = new THREE.BoxGeometry(20, 20, 2);
        for (let i = 0; i < 400; i++) {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            
            // Randomly scatter walls across a massive area
            wall.position.x = (Math.random() - 0.5) * 800;
            wall.position.z = (Math.random() - 0.5) * 800;
            wall.position.y = 10;
            
            // Randomly rotate some walls 90 degrees to create a maze feel
            if (Math.random() > 0.5) {
                wall.rotation.y = Math.PI / 2;
            }
            scene.add(wall);
        }

        // --- 4. FIRST PERSON CONTROLS ---
        const controls = new THREE.PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const instructions = document.getElementById('instructions');

        // Lock mouse pointer to screen when clicked
        instructions.addEventListener('click', function () {
            controls.lock();
        });

        // Hide menu when playing, show when paused (ESC)
        controls.addEventListener('lock', function () {
            blocker.style.display = 'none';
        });
        controls.addEventListener('unlock', function () {
            blocker.style.display = 'flex';
        });
        scene.add(controls.getObject());

        // --- 5. MOVEMENT LOGIC ---
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        // Listen for key presses
        document.addEventListener('keydown', (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // --- 6. GAME ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (controls.isLocked === true) {
                const time = performance.now();
                const delta = (time - prevTime) / 1000; // Calculate time between frames

                // Smooth deceleration
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                // Determine direction based on keys pressed
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize(); // Ensures consistent diagonal speed

                // Apply movement speed
                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                // Move the camera
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                prevTime = time;
            }

            renderer.render(scene, camera);
        }

        animate(); // Start the loop

        // Keep the game full screen if the browser window is resized
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
